<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>地図ラボ</title>
  <meta name="description" content="中学受験の地理を、地図と統計でいっしょに覚える。県庁所在地・地形・世界遺産・農産物と工業のランキング。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23e8f3f8'/%3E%3Cpath d='M22 5c2 2 3 5 1 7l-4 4-3 6-6 4-4-1 5-5 3-5 4-4z' fill='%23e57c5b'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>地図ラボ<small>日本の地理</small></h1>
    </div>
    <nav class="modes" role="tablist" aria-label="モード">
      <button role="tab" data-mode="map" aria-selected="true">地図</button>
      <button role="tab" data-mode="rank">ランキング</button>
      <button role="tab" data-mode="pop">人口</button>
      <button role="tab" data-mode="about">出典</button>
    </nav>
  </header>

  <main class="stage">
    <section class="map-area">
      <div class="toolbar" id="toolbar"></div>
      <div class="map-wrap" id="mapWrap">
        <svg id="map" role="img" aria-label="日本地図"></svg>
        <div class="map-buttons">
          <button id="zoomIn" aria-label="拡大">＋</button>
          <button id="zoomOut" aria-label="縮小">－</button>
          <button id="zoomReset" aria-label="全体を表示">⤢</button>
        </div>
        <div class="legend" id="legend" hidden></div>
        <div class="tooltip" id="tooltip" hidden></div>
      </div>
    </section>
    <aside class="panel" id="panel" aria-live="polite">
      <button class="panel-grip" id="panelGrip" aria-label="パネルを開閉"></button>
      <div class="panel-body" id="panelBody"></div>
    </aside>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
